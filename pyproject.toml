[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ai"
version = "0.1.0"
description = "ForgeAI — Autonomous Software Engineering Agent"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Only files named test_*.py are tests. Manual scripts (e.g. tests/manual_*.py)
# call real LLMs and must never be collected/executed by pytest.
python_files = ["test_*.py"]